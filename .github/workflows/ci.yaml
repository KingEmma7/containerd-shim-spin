name: ci
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'Makefile'

env:
  CARGO_TERM_COLOR: always
permissions:
  contents: read
jobs:
  rustfmt:
    uses: ./.github/workflows/action-check.yml
  build:
    uses: ./.github/workflows/action-build.yaml
  # Fork-only validation: keep the original build/test workflows and artifact path.
  # Image-publishing workflows request write permissions and are outside this check.
  test:
    needs: build
    uses: ./.github/workflows/action-test.yml
